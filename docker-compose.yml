services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://postgres:postgres@host.docker.internal:5432/postgres}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      EMAIL_APP_EMAIL: ${EMAIL_APP_EMAIL:-}
      EMAIL_APP_PASSWORD: ${EMAIL_APP_PASSWORD:-}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - app_temp_files:/app/website/Temporary_Files
      - app_artifacts:/app/artifacts

volumes:
  app_temp_files:
  app_artifacts:
