<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Model Trainer & Scorer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      display: flex;
      height: 100vh;
    }
    .sidebar {
      width: 200px;
      background-color: #2c3e50;
      color: white;
      padding: 1rem;
    }
    .sidebar button {
      display: block;
      width: 100%;
      margin: 1rem 0;
      padding: 0.5rem;
      background-color: #34495e;
      border: none;
      color: white;
      cursor: pointer;
    }
    .main {
      flex-grow: 1;
      padding: 2rem;
      overflow-y: auto;
    }
    .hidden {
      display: none;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 0.5rem;
    }
    input[type="file"] {
      margin-top: 1rem;
    }
    #result-table {
      max-height: 400px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
    <div class="sidebar">
        <button onclick="showSection('train-section')">Train Model</button>
        <button onclick="showSection('inference-section')">Run Inference</button>
        <button onclick="showSection('results')">View Results</button>
      </div>
  
    <div class="main">
      <!-- Train Your Model -->
        <div id="train-section" class="section">
            <h2>Train Your Model</h2>
        
            <!-- Step 1: Upload -->
            <h3>Step 1: Upload Training Data</h3>
            <input type="file" id="train-file" accept=".csv" />
            <button onclick="uploadCSV('train')">Upload</button>
        
            <!-- Display Uploaded Training CSV -->
            <div style="margin-top: 1rem;">
            <h4>Training Data Preview:</h4>
            <div id="uploaded-train-preview" style="max-height: 300px; overflow-y: auto; border: 1px solid #ccc;"></div>
            </div>
        
            <!-- Step 2: Train -->
            <h3>Step 2: Run Training</h3>
            <button onclick="trainModel()">Train Model</button>

            <!-- Display Metrics -->
            <div style="margin-top: 1rem;">
              <h4>Training Details:</h4>
              <div id="training-details-preview" style="max-height: 300px; overflow-y: auto; border: 1px solid #ccc;"></div>
              </div>
        </div>
  
      <!-- Show Predictions -->
      <div id="inference-section" class="section hidden">
        <h2>Inference Model</h2>
        
        <!-- Step 1: Upload -->
        <h3>Step 1: Upload Scoring Data</h3>
        <input type="file" id="scoring-file" accept=".csv" />
        <button onclick="uploadCSV('scoring')">Upload</button>

        <!-- Display Uploaded Scoring CSV --> 
        <div style="margin-top: 1rem;">
        <h4>Scoring Data Preview:</h4>
        <div id="uploaded-scoring-preview" style="max-height: 300px; overflow-y: auto; border: 1px solid #ccc;"></div>
        </div>
        
        <!-- Step 1: Upload -->
        <h3>Step 2: Run Inference</h3>
        <button onclick="inferenceModel('scoring')">Upload</button>

      </div>
    </div>
  </body>
  
<script src="{{ url_for('static', filename='script.js') }}"></script>
</html>
